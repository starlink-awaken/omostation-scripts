name: cross-deps-enforce
# P47+: 跨层 import 违规 enforce (防回归).
# 复用 bin/layer-dependency-check.py (docs/layer-contract.yaml). 原引用的
# scripts/check-cross-deps.py 在仓库中从未存在 → 每次 push/PR 恒红.
# 分层依赖检查 (L3→L2→L1→L0) 覆盖 cockpit→kairon / agora→cockpit / ecos→kairon
# / omo→kairon 等层间 import 规则; cockpit→runtime 是设计依赖 (agent_runtime
# 桥接) 由 layer-contract 豁免.
on: [push, pull_request]

jobs:
  check:
    name: cross-layer deps check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: Run cross-layer dependency check
        run: python3 bin/layer-dependency-check.py
