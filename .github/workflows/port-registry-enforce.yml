name: port-registry-enforce
# P47 A1: 端口硬编码 enforce (声明/执行鸿沟收口).
# 复用 bin/ssot/check-hardcoded-ports.py (P77 跨仓端口硬编码扫描 + env var 检验).
# 原引用的 scripts/check-vault-paths.py 在仓库中从未存在 → 每次 push/PR 恒红.
# check-hardcoded-ports 自动读 protocols/port-registry.yaml + port-hardcode-baseline,
# 已注册/已知历史容忍, 新违规 fail.
# 刷新 baseline: python3 bin/ssot/check-hardcoded-ports.py --json (仅诊断)
on: [push, pull_request]

jobs:
  check:
    name: port hardcode check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install pyyaml
      - name: Run port hardcode check
        run: python3 bin/ssot/check-hardcoded-ports.py
